[package]
name = "rrp"
version = "0.1.0"
edition = "2021"
description = "Rust Reverse Proxy with post-quantum mlkem768x25519plus encryption and eBPF acceleration"
license = "MIT"
repository = "https://github.com/FeulerLoup/rrp"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
ml-kem = "0.2"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
socket2 = { version = "0.5", features = ["all"] }
bytes = "1.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
libc = "0.2"
dashmap = "6.0"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# Keep unwinding: tokio isolates a panicking connection task as a JoinError instead of the whole
# proxy process aborting and dropping every live tunnel.
panic = "unwind"

